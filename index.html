<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	  <title>ÖNB-API-IIIF Viewer</title>
	  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>

	  <header class="primary bottom-margin">
		  <nav class="wrap vertical-padding">
			  <h1 class="h6">ÖNB-API-IIIF Viewer</h1>
			  <form class="field label prefix round inverse-primary max" id="manifestUrlForm">
				  <i aria-hidden="true">link_2</i>
				  <input type="url" name="manifestUrl" id="manifestUrlInput" />
				  <label>Manifest URL</label>
			  </form>
		  </nav>
	  </header>

	  <main class="responsive">
		  <div class="grid">
			  <div id="canvasContainer" class="s3 max-h-50">

				  <template id="canvasTemplate">
					  <article class="canvasCard no-padding border">
						  <img class="canvasImage responsive medium" src="" loading="lazy">
						  <div class="row absolute bottom left right padding bottom-shadow white-text border-inherit">
							  <h5 class="canvasLabel"></h5>
						  </div>
					  </article>
				  </template>

			  </div>
			  <div class="s9">
				  <img id="currentImage" class="max-h-50" src="" loading="eager" />
			  </div>
		  </div>

		  <article>
			  <h2 class="h5 linkify" id="manifestLabel">
				  …
			  </h2>
			  <p class="linkify" id="manifestDescription">
				  …
			  </p>

			  <div class="space"></div>

			  <details id="manifestMetadataContainer">
				  <summary class="button">
					  Metadata
				  </summary>
				  <table class="border">
					  <tbody id="manifestMetadataBody" class="linkify">

						  <template id="manifestMetadataRowTemplate">
							  <tr>
								  <td><b class="manifestMetadataLabel"></b></td>
								  <td class="manifestMetadataValue"></td>
							  </tr>
						  </template>

					  </tbody>
				  </table>
			  </details>

			  <div id="manifestMetadataSpace" class="medium-space"></div>

			  <details>
				  <summary class="button">
					  Rights and Licensing
				  </summary>
				  <div class="row wrap">
					  <div>
						  <img id="manifestLogo" class="responsive" src="" alt="Logo">
					  </div>
					  <div class="max">
						  <h5 class="small">Attribution</h5>
						  <p id="manifestAttribution" class="no-margin">
							  …
						  </p>

						  <h5 class="small">License</h5>
						  <p class="no-margin">
							  <a id="manifestLicense" href="#" class="link">
								  …
							  </a>
						  </p>
					  </div>
				  </div>
			  </details>

			  <div class="medium-space"></div>

			  <details>
				  <summary class="button">
					  Links
				  </summary>
				  <div class="top-margin">
						<h5 class="small">See also</h5>
					  <ul class="listify no-margin" id="manifestSeeAlsoList">
						  <template id="manifestSeeAlsoListItemTemplate">
							  <li>
								  <a class="manifestSeeAlsoLink link" href="#"></a>
								  <span class="manifestSeeAlsoInfo"></span>
							  </li>
						  </template>
					  </ul>
				  </div>
			  </details>
		  </article>

		  <div class="large-space"></div>
	  </main>

	  <dialog class="modal" id="errorModal">
		  <h5><i class="extra" aria-hidden="true">error</i> An error occurred</h5>
		  <pre class="error-text"><code id="errorModalTrace">(N/A)</code></pre>
	  </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
